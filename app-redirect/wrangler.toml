# Worker aparte del principal (dotcasa-domain). Solo atiende app.dotcasa.com.mx.
# Despliegue (en este orden, ver README.md):
#   1. Secreto en el Worker principal y deploy del principal
#   2. cd app-redirect && npx wrangler secret put ORIGEN_TOKEN   (el mismo valor)
#   3. cd app-redirect && npx wrangler deploy
name = "dotcasa-app-redirect"
main = "src/index.js"
compatibility_date = "2024-03-01"

# El registro DNS de app debe estar "con proxy" (nube naranja) en Cloudflare
# para que la ruta se aplique.
routes = [
  { pattern = "app.dotcasa.com.mx/*", zone_name = "dotcasa.com.mx" }
]
